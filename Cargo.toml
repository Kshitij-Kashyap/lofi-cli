[package]
name = "lofi"
version = "0.1.0"
edition = "2021"
description = "Terminal lo-fi / ambient internet radio player"
license = "MIT"
readme = "README.md"
rust-version = "1.75"

[[bin]]
name = "lofi"
path = "src/main.rs"

[features]
default = []
# Real audio output via rodio/cpal. Requires system audio libs on Linux:
#   Arch:   pacman -S alsa-lib
#   Debian: apt install libasound2-dev
# Build portable (no system deps) without this feature; tests always run without it.
audio = ["rodio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.20", optional = true }
bytes = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
